<svg xmlns="http://www.w3.org/2000/svg" width="320" height="560" viewBox="0 0 320 560" role="img">
  <title>GNOME extension menu for the Avell RGB keyboard</title>
  <rect width="320" height="560" rx="18" fill="#241f24"/>
  <rect x="12" y="12" width="296" height="536" rx="14" fill="#2b262c"/>

